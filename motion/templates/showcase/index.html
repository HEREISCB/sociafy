<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"brandName","type":"string","label":"Brand name","default":""},
  {"id":"tagline","type":"string","label":"Tagline","default":""},
  {"id":"cta","type":"string","label":"Call to action","default":""},
  {"id":"hook","type":"string","label":"Hook line (*word* = highlight)","default":""},
  {"id":"logoUrl","type":"image","label":"Logo","default":""},
  {"id":"logoReverseUrl","type":"image","label":"Logo (reverse)","default":""},
  {"id":"fontDisplayUrl","type":"string","label":"Display font woff2 URL","default":""},
  {"id":"fontBodyUrl","type":"string","label":"Body font woff2 URL","default":""},
  {"id":"musicUrl","type":"string","label":"Music URL","default":""},
  {"id":"style","type":"enum","label":"Style","default":"soft","options":[{"value":"soft","label":"Soft"},{"value":"bold","label":"Bold"}]},
  {"id":"musicMood","type":"enum","label":"Music mood","default":"none","options":[{"value":"calm","label":"Calm"},{"value":"upbeat","label":"Upbeat"},{"value":"cinematic","label":"Cinematic"},{"value":"none","label":"None"}]}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="kit.css" />
    <script src="gsap.min.js"></script>
    <script src="kit.js"></script>
    <style>
      #hookTxt { text-align: center; line-height: 1.08; width: 900px; }
      .h #hookTxt { width: 1500px; }
      #shots { opacity: 0; }
      .cap { opacity: 0; position: absolute; left: 90px; top: 270px; width: 900px; height: 330px; display: flex; align-items: center; justify-content: center; }
      .h .cap { left: 110px; top: 0; width: 660px; height: 100%; justify-content: flex-start; }
      .capTxt { width: 100%; line-height: 1.08; text-align: center; }
      .h .capTxt { text-align: left; }
      .card { position: absolute; padding: 12px; border-radius: 36px; background: rgba(255, 255, 255, 0.72); box-shadow: 0 50px 90px -50px var(--shadow), 0 0 0 1.5px var(--line); }
      .dark .card { background: rgba(255, 255, 255, 0.08); }
      .bold .card { border-radius: 16px; padding: 8px; }
      .card img, .card .ph { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0%; border-radius: 26px; }
      .bold .card img, .bold .card .ph { border-radius: 10px; }
      .card .ph { background: var(--grad2); display: flex; align-items: center; justify-content: center; text-align: center; padding: 60px; color: var(--onP); line-height: 1.1; }
      #pips { position: absolute; left: 0; right: 0; bottom: 150px; display: flex; justify-content: center; gap: 12px; }
      .h #pips { left: 110px; right: auto; bottom: 120px; justify-content: flex-start; }
      #pips i { display: block; width: 16px; height: 8px; border-radius: 4px; background: var(--line); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920"></div>
    <script>
      MK.boot(
        {
          hook: "See it in *action*",
          facts: ["Plan the *week*", "Post *everywhere*", "Learn what *works*"],
          lines: [],
        },
        async (k) => {
          const { v, T, V, W, H, tl, el, words, fit, ROOT, E } = k;
          ROOT.style.setProperty("--grad2", `linear-gradient(135deg, ${T.p} 0%, ${T.s} 100%)`);
          ROOT.style.setProperty("--onP", MK.contrast(T.p, "#ffffff") >= 3 ? "#ffffff" : "#111114");

          // ---- hook 0 → 2.7 ----
          const sHook = el("div", { className: "scene", id: "hook" }, ROOT);
          const hk = el("div", { id: "hookTxt", className: "disp grad" }, sHook);
          const hw = words(hk, v.hook);
          fit(hk, V ? 120 : 128, V ? 760 : 560, 40);
          k.show(sHook, 0, 2.75);
          k.rise(hw, 0.25, 0.08, 1.0);
          tl.fromTo(hk, { scale: 1.04 }, { scale: 1, duration: 2.5, ease: "power2.out" }, 0.25);
          k.sink(hw, 2.3);

          // ---- shots 2.7 → 13.0 ----
          // Real screenshots (≤4) or brand-coloured placeholder panels when none are given.
          // unreadable/missing images are dropped; zero left → placeholders
          const shots = (await Promise.all(v.screenshots.slice(0, 4).map(k.loadImg))).filter(Boolean);
          const beatsN = shots.length || 3;
          const caption = (i) => v.lines[i] || v.facts[i] || "";
          const box = V ? { cx: W / 2, cy: 1210, w: 900, h: 1020 } : { cx: 1340, cy: H / 2 + 10, w: 1020, h: 800 };
          const sS = el("div", { className: "scene", id: "shots" }, ROOT);
          const pips = el("div", { id: "pips" }, sS);
          const beats = [];
          for (let i = 0; i < beatsN; i++) {
            const card = el("div", { className: "card" }, sS);
            let ratio = 0.8; // w/h
            if (shots[i]) {
              const img = shots[i];
              card.appendChild(img);
              beats.push({ card, img });
            } else {
              const ph = el("div", { className: "ph disp" }, card);
              const pt = el("div", { textContent: k.plain(caption(i) || v.brandName) }, ph);
              pt.style.width = "100%";
              beats.push({ card, ph: pt });
            }
            el("i", {}, pips);
          }
          {
            const beat = 10.3 / beatsN, t0 = 2.7;
            k.show(sS, t0, 13.05);
            beats.forEach((b, i) => {
              // size the card to the image aspect (clamped so very tall pages crop from the top)
              let r = b.img && b.img.naturalWidth ? b.img.naturalWidth / b.img.naturalHeight : 0.8;
              r = Math.min(1.9, Math.max(0.56, r));
              let w = box.w, h = w / r;
              if (h > box.h) { h = box.h; w = h * r; }
              Object.assign(b.card.style, { width: w + "px", height: h + "px", left: box.cx - w / 2 + "px", top: box.cy - h / 2 + "px" });
              if (b.ph) fit(b.ph, V ? 110 : 96, h - 160, 28);

              const cap = el("div", { className: "cap" }, sS);
              const ct = el("div", { className: "capTxt disp" }, cap);
              const cw = caption(i) ? words(ct, caption(i), { autoKw: true }) : [];
              if (cw.length) fit(ct, V ? 100 : 104, V ? 320 : 520, 34);

              const at = t0 + i * beat, last = i === beatsN - 1;
              const tilt = i % 2 ? -1.6 : 1.6;
              tl.fromTo(b.card, { opacity: 0, y: V ? 220 : 160, scale: 0.9, rotation: tilt, filter: "blur(10px)" },
                { opacity: 1, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 1.2, ease: E.in }, at);
              tl.to(b.card, { scale: 1.035, duration: beat - 0.3, ease: "sine.inOut" }, at + 1.0);
              if (!last) tl.to(b.card, { opacity: 0, y: V ? -140 : -100, scale: 0.94, filter: "blur(8px)", duration: 0.55, ease: "power3.in" }, at + beat - 0.35);
              else tl.to(b.card, { opacity: 0, y: -60, scale: 0.96, filter: "blur(8px)", duration: 0.5, ease: "power3.in" }, 12.55);
              if (cw.length) {
                k.show(cap, at, last ? 13.0 : at + beat); // only the live caption is visible
                k.rise(cw, at + 0.3, 0.07, 0.95);
                k.sink(cw, last ? 12.5 : at + beat - 0.4);
              }
              const pip = pips.children[i];
              tl.to(pip, { width: 44, backgroundColor: T.hl, duration: 0.5, ease: "expo.out" }, at);
              if (!last) tl.to(pip, { width: 16, backgroundColor: T.line, duration: 0.5, ease: "expo.out" }, at + beat);
            });
            tl.fromTo(pips, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, t0 + 0.2);
            tl.to(pips, { opacity: 0, duration: 0.4, ease: "power3.in" }, 12.5);

            k.chip(0.5, 12.7);
            k.endCard(13.1, { tagline: true });
          }
        }
      ).then(({ tl }) => {
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        tl.seek(0);
      });
    </script>
  </body>
</html>
