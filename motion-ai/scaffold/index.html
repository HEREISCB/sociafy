<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* @font-face rules for assets/fonts/* go here (see BRIEF.md) */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: {{BG}}; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: {{BG}}; color: {{TEXT}}; font-family: "Noto Sans", sans-serif; }
      .clip { position: absolute; inset: 0; display: grid; place-items: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
      <section id="s1" class="clip" data-start="0" data-duration="{{DUR}}">
        <h1 id="title">TODO</h1>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#title", { y: 40, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
