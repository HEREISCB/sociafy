# /etc/nginx/sites-available/sociafy.conf
#
# Reverse-proxy Cloudflare → Next.js (running on 127.0.0.1:3000).
#
# Install:
#   sudo install -m 0644 etc/nginx/sites-available/sociafy.conf \
#     /etc/nginx/sites-available/sociafy.conf
#   sudo ln -sf /etc/nginx/sites-available/sociafy.conf \
#     /etc/nginx/sites-enabled/sociafy.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN throughout. Cloudflare Origin Cert lives at:
#   /etc/ssl/cloudflare/origin.pem  (cert)
#   /etc/ssl/cloudflare/origin.key  (private key, mode 0600)

# Drop the connection if the request doesn't come from Cloudflare.
# IP lists below are the canonical Cloudflare ranges (update from
# https://www.cloudflare.com/ips/ if Cloudflare expands them).
#
# Cloudflare IPv4:
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# Cloudflare IPv6:
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Common upstream — keepalive lowers the per-request handshake cost.
upstream sociafy_app {
  server 127.0.0.1:3000 fail_timeout=0;
  keepalive 32;
}

# Plain HTTP → HTTPS redirect. Cloudflare also does "Always Use HTTPS",
# but keep this so direct origin hits still upgrade.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name YOUR_DOMAIN www.YOUR_DOMAIN;

  # Cloudflare Origin Certificate
  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Generous limits — webhook payloads from Meta/Stripe can be big, video
  # uploads larger.
  client_max_body_size 50m;
  client_body_buffer_size 256k;
  client_body_timeout 60s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  send_timeout 120s;

  # Gzip is fine on top of Cloudflare; both compress, Cloudflare strips the
  # double-encoded layer.
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # Block direct (non-Cloudflare) traffic at the app layer. nginx already
  # has set_real_ip_from above; we additionally insist the proxy header is
  # present, which Cloudflare always sends and direct hits never do.
  set $is_cloudflare 0;
  if ($http_cf_connecting_ip)                 { set $is_cloudflare 1; }
  if ($is_cloudflare = 0)                     { return 403; }

  # Static assets — cache hard. Next.js fingerprints filenames so this
  # never serves stale code.
  location /_next/static/ {
    proxy_pass http://sociafy_app;
    proxy_set_header Host $host;
    proxy_cache_valid 200 365d;
    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /favicon.ico {
    proxy_pass http://sociafy_app;
    proxy_set_header Host $host;
    expires 7d;
    access_log off;
  }

  # Everything else — including /api/*, /dashboard, etc. — goes to Next.js.
  location / {
    proxy_pass http://sociafy_app;
    proxy_http_version 1.1;
    proxy_set_header Connection         "";
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  https;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header CF-Connecting-IP   $http_cf_connecting_ip;
    proxy_set_header CF-IPCountry       $http_cf_ipcountry;
    proxy_set_header CF-Ray             $http_cf_ray;

    # SWR streaming + EventSource benefit from this
    proxy_buffering off;
    proxy_request_buffering off;
  }
}
